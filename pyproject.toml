[project]
name = "football-agent"
version = "0.1.0"
description = "An autonomous Fantasy Premier League manager built from a solver and open-weight LLM agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
football-agent = "football_agent.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
